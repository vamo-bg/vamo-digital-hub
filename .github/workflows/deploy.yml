name: Deploy

# Всеки push към main билдва сайта и качва само променените файлове към хостинга.
# "Run workflow" в раздела Actions пуска същото ръчно, без нов commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Пробно пускане — показва какво би се качило, без да пипа сървъра'
        type: boolean
        default: false

# Два деплоя никога не текат едновременно към един и същ сървър.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to vamo.bg
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Изтегляне на кода
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Инсталиране на зависимостите
        run: npm ci

      # Счупен тип или невалидно съдържание спира деплоя, преди да стигне до сървъра.
      - name: Проверка на типовете и съдържанието
        run: npm run check

      - name: Билд
        run: npm run build

      # Оригиналните PDF файлове надвишават GitHub Git лимита за файл.
      # Release assets ги пазят без промени; те остават достъпни на vamo.bg.
      - name: Изтегляне на оригиналните каталози
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download catalogues-2026-2027 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern vamo-katalog-podaratsi-2026.pdf \
            --pattern vamo-katalog-alexander-2027.pdf \
            --dir ./dist/documents/catalogues/
          cd ./dist/documents/catalogues/
          sha256sum --check <<'CHECKSUMS'
          25e623dc8ec8b070b55f615316fb3111e64d9da43451005b3b3ef9cf43e17cbd  vamo-katalog-podaratsi-2026.pdf
          5725c4184b44600e277157a3cda7f1f957852fbdeb5051a09f7efa3cd9a810c9  vamo-katalog-alexander-2027.pdf
          CHECKSUMS

      # Само блогът пази дата на промяна в схемата си — вижда scripts/add-sitemap-lastmod.mjs.
      - name: Lastmod в sitemap
        run: npm run sitemap:lastmod

      # Страница с noindex в sitemap е противоречива инструкция към Google.
      # Проверката гледа готовия изход, не намерението, и спира деплоя.
      - name: Проверка на sitemap
        run: npm run check:sitemap

      # Действието пази списък на състоянието на сървъра и при всяко следващо
      # пускане качва единствено разликите.
      - name: Качване по FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          dry-run: ${{ inputs.dry_run == true }}
          # Никога да не трие целия сървър преди качване.
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
