name: Diagnose FTP
# Временно. Показва как изглежда сървърът от гледна точка на GitHub.
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Откъде се свързваме
        run: |
          echo "Публичен IP на този сървър: $(curl -s --max-time 10 https://api.ipify.org)"
          echo "Държава: $(curl -s --max-time 10 https://ipinfo.io/country || echo '?')"

      - name: Разговор със сървъра
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, socket, ssl
          host, port = "ftp.webinaria.eu", 21
          user, pw = os.environ["FTP_USER"], os.environ["FTP_PASS"]
          print(f"Потребител: {user}")
          print(f"Дължина на паролата: {len(pw)} знака")
          print(f"Има ли интервали в края: {pw != pw.strip()}")
          s = socket.create_connection((host, port), timeout=20); s.settimeout(20)
          f = s.makefile("rwb")
          def read():
              lines = []
              while True:
                  l = f.readline().decode(errors="replace").rstrip()
                  lines.append(l)
                  if len(l) >= 4 and l[3] == " ": break
              return "\n".join(lines)
          def send(cmd, show):
              f.write((cmd + "\r\n").encode()); f.flush()
              r = read(); print(f"  {show} → {r}"); return r
          print("\nБез криптиране:")
          print("  banner →", read().splitlines()[-1])
          send("AUTH TLS", "AUTH TLS")
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          t = ctx.wrap_socket(s, server_hostname=host)
          f = t.makefile("rwb")
          print("\nСлед криптиране:")
          send(f"USER {user}", "USER")
          r = send(f"PASS {pw}", "PASS <скрита>")
          print("\nРЕЗУЛТАТ:", "успех" if r.startswith("230") else "отказано")
          PY
